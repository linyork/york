[project]
name = "york"
version = "1.2601.5"
description = "Friday MCP Agent - Python Implementation"
authors = [{ name = "York", email = "linyouxun@example.com" }]
requires-python = ">=3.12"
dependencies = [
    # MCP Framework
    "fastmcp>=0.3.0",
    # Vector Database
    "lancedb>=0.15.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    # Code Analysis
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # Document Processing
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "markdown>=3.7",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "mcp>=1.25.0",
    # Dashboard
    "streamlit>=1.31.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
